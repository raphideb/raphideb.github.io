{{ if eq .Section "astronomy" -}}
<script>
  // Astronomy pages are dark by default and remember their own light/dark choice,
  // independent of the rest of the site. Applied here to avoid a light flash on load.
  (() => {
    const root = document.documentElement
    root.dataset.themeKey = 'td-color-theme-astronomy'
    root.dataset.themeDefault = 'dark'
    let theme = null
    try { theme = localStorage.getItem(root.dataset.themeKey) } catch (e) {}
    theme = theme || 'dark'
    if (theme === 'auto') {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    root.setAttribute('data-bs-theme', theme)
  })()
</script>
{{ end -}}
