baseURL = "https://crashdump.info/"
locale = "en-us"
title = "crashdump"

enableMissingTranslationPlaceholders = true

# Required if you want to render robots.txt template
#enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
   tag = "tags"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Configure how URLs look like per section.
[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

# Image processing configuration.
[imaging]
resampleFilter = "CatmullRom"
anchor = "smart"

[imaging.jpeg]
quality = 75

[imaging.webp]
quality = 75

[params.ui]
# Docsy 0.14 changed the navbar default from always-dark to the site theme.
navbar_theme = "dark"
breadcrumb_disable = false
footer_about_enable = true
navbar_logo = true
navbar_translucent_over_cover_disable = false
sidebar_menu_compact = false
sidebar_search_disable = false
sidebar_menu_foldable = false
showLightDarkModeMenu = true

[params]
github_repo = "https://github.com/raphideb/raphideb.github.io"

# Highlighting config
pygmentsCodeFences = true
pygmentsUseClasses = false
# Use the new Chroma Go highlighter in Hugo.
pygmentsUseClassic = false
#pygmentsOptions = "linenos=table"
# See https://help.farbox.com/pygments.html
pygmentsStyle = "tango"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[markup]
  [markup.highlight]
      style = "tango"
      noClasses = false

[markup.goldmark.renderer]
unsafe = true

[params.ui.readingtime]
enable = true

[params.drawio]
enable = true

[module]
[module.hugoVersion]
extended = true
min = "0.163.0"
proxy = "direct"
[[module.imports]]
path = "github.com/google/docsy"

[[menu.main]]
    name = "Postgres documentation"
    weight = 10
    url = "https://www.postgresql.org/docs/"
    
[[menu.main]]
    name = "Oracle documentation"
    weight = 20
    url = "https://docs.oracle.com/en/database/oracle/oracle-database/index.html"

[[menu.main]]
    name = "Kubernetes documentation"
    weight = 25
    url = "https://kubernetes.io/docs/"

[[menu.main]]
    name = "Claude"
    weight = 27
    url = "https://claude.ai/"

[[menu.main]]
    name = "Cloudy Nights"
    weight = 29
    url = "https://www.cloudynights.com/"

